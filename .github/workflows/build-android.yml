name: Build Android APK

on:
  # Build an APK only when explicitly wanted — a version tag or a manual run —
  # not on every commit to main (that piled up 90-day-retained APK artifacts
  # and filled the account's Actions storage). Use `git tag v1.2.3 && git push
  # --tags`, or trigger "Build Android APK" from the Actions tab.
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
          VITE_REVENUECAT_ANDROID_KEY: ${{ secrets.VITE_REVENUECAT_ANDROID_KEY }}
          # Feature flags — keep in lockstep with Vercel production env.
          # (Past APKs built with ALL of these unset: collab, realtime,
          # Routes Lens dark and Android payments dead.)
          VITE_APP_ENV: production
          VITE_BRAINSTORM_ENABLED: "true"
          VITE_PAYMENTS_ENABLED: "true"
          VITE_INVITE_ENABLED: "true"
          VITE_REALTIME_ENABLED: "true"
          VITE_ROUTES_LENS_ENABLED: "true"

      - name: Add Android platform
        run: npx cap add android || true

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          # Auto-expire quickly so APKs don't accumulate in Actions storage.
          retention-days: 5
