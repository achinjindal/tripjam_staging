name: Build Android APK

on:
  # Build an APK only when explicitly wanted — a version tag or a manual run —
  # not on every commit to main (that piled up 90-day-retained APK artifacts
  # and filled the account's Actions storage). Use `git tag v1.2.3 && git push
  # --tags`, or trigger "Build Android APK" from the Actions tab.
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # `secrets` is NOT an available context in step-level `if:` conditions —
    # a check like `if: secrets.X != ''` evaluates false and SILENTLY skips the
    # step, which here would mean quietly shipping no signed bundle at all.
    # Map it to env at job level, where secrets IS allowed, and branch on that.
    env:
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # android-actions/setup-android@v3 crashes on the Node-24 runner image
      # (sdkmanager version mismatch mid license-acceptance, 2026-09). The
      # ubuntu-latest runner preinstalls the SDK — accepting licenses directly
      # is all gradle needs.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
          VITE_REVENUECAT_ANDROID_KEY: ${{ secrets.VITE_REVENUECAT_ANDROID_KEY }}
          # Feature flags — keep in lockstep with Vercel production env.
          # (Past APKs built with ALL of these unset: collab, realtime,
          # Routes Lens dark and Android payments dead.)
          VITE_APP_ENV: production
          VITE_BRAINSTORM_ENABLED: "true"
          VITE_PAYMENTS_ENABLED: "true"
          VITE_INVITE_ENABLED: "true"
          VITE_REALTIME_ENABLED: "true"
          VITE_ROUTES_LENS_ENABLED: "true"
          VITE_PLACE_PEEK_ENABLED: "true"
          # NOT a flag — without it the Board hides email booking ingestion
          # entirely (`{VITE_EMAIL_INGEST_ADDRESS && …}`), so the APK silently
          # shipped without a whole feature the web app has. Must equal the
          # INBOUND_EMAIL_ADDRESS edge secret or users forward to a dead
          # address; see the pairing rule in CLAUDE.md.
          VITE_EMAIL_INGEST_ADDRESS: "bookings@booilkeuku.resend.app"

      - name: Add Android platform
        run: npx cap add android || true

      - name: Sync Capacitor Android
        run: npx cap sync android

      # Play requires a SIGNED RELEASE .aab — it rejects debug-signed uploads
      # and, for apps created after Aug 2021, bare APKs. This step is skipped
      # when the signing secrets are absent so a fork still gets a build;
      # the release step below then fails loudly rather than producing an
      # artifact that looks uploadable and is not.
      - name: Decode upload keystore
        if: env.HAS_SIGNING == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build signed release bundle (.aab)
        if: env.HAS_SIGNING == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      # Guard: a release bundle built WITHOUT the signing env is unsigned and
      # Play rejects it at upload with an unhelpful error. Catch it here.
      - name: Verify the bundle is signed
        if: env.HAS_SIGNING == 'true'
        run: |
          aab=android/app/build/outputs/bundle/release/app-release.aab
          test -f "$aab" || { echo "::error::no .aab produced"; exit 1; }
          unzip -l "$aab" | grep -q "META-INF/.*\.RSA\|META-INF/.*\.EC" \
            || { echo "::error::$aab is UNSIGNED — Play will reject it"; exit 1; }
          echo "::notice::signed bundle OK ($(du -h "$aab" | cut -f1))"

      - name: Upload .aab artifact
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      # Fallback for forks / runs without signing secrets: a debug APK is
      # still useful for sideloading, and is clearly named so nobody mistakes
      # it for something Play will accept.
      - name: Build debug APK (no signing secrets)
        if: env.HAS_SIGNING != 'true'
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload debug APK (NOT publishable)
        if: env.HAS_SIGNING != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-NOT-FOR-PLAY
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 5
