apply plugin: 'com.android.application'

// ── Version + release guard ──────────────────────────────────────────────
// Version comes from the git TAG in CI (build-android.yml derives
// v1.2.3 -> 10203). Play rejects any upload whose versionCode is not
// strictly higher than the last, and nothing used to increment this — so the
// SECOND upload would always have been rejected, at the upload step, with the
// build long finished. Derived rather than auto-incremented on purpose: the
// same tag must always produce the same versionCode, so re-running a build is
// idempotent instead of silently minting a new version.
//
// A RELEASE build without the env set is refused outright. The old fallback
// quietly stamped versionCode 2 on any local `bundleRelease`, and that number
// is spent the moment it reaches Play. A local release build also inlines
// whatever happens to be in .env.production — which is how an .aab shipped
// with no PostHog key and therefore no crash reporting at all. Release
// artifacts come from CI; failing here makes that a rule, not a habit.
def envVersionCode = System.getenv("ANDROID_VERSION_CODE")
def envVersionName = System.getenv("ANDROID_VERSION_NAME")
def wantsRelease = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains("release")
}
if (wantsRelease && !envVersionCode) {
    throw new GradleException(
        "Refusing to build a release without ANDROID_VERSION_CODE.\n" +
        "Release builds come from CI: `git tag vX.Y.Z && git push origin vX.Y.Z`,\n" +
        "which derives the versionCode from the tag and injects the signing and\n" +
        "VITE_* secrets. Building one locally stamps versionCode 2 and silently\n" +
        "ships whatever .env.production holds."
    )
}

android {
    namespace "com.tripjam.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.tripjam.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Version comes from the git TAG in CI (see build-android.yml);
        // resolved at script scope above so the guard runs before any
        // configuration happens.
        versionCode envVersionCode ? envVersionCode.toInteger() : 2
        versionName envVersionName ?: "0.0.0-local"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release signing, driven entirely by environment variables so no key
    // material ever enters the repo. CI writes the keystore from the
    // ANDROID_KEYSTORE_BASE64 secret to a temp file and exports these four.
    //
    // When the variables are absent — any local `./gradlew assembleRelease`,
    // or a fork without the secrets — signingConfig stays null and Gradle
    // produces an UNSIGNED release artifact rather than failing the build or,
    // worse, silently falling back to the debug key (which Play rejects at
    // upload with a confusing error).
    signingConfigs {
        release {
            def ksPath = System.getenv("ANDROID_KEYSTORE_PATH")
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig System.getenv("ANDROID_KEYSTORE_PATH")
                ? signingConfigs.release
                : null
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
