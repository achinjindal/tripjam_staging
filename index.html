<!doctype html>
<html lang="en" style="height: 100%; overflow: hidden">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="theme-color" content="#2563A8" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <title>TripJam — AI travel planning that feels personal</title>
    <meta
      name="description"
      content="Plan trips that feel like actually yours. TripJam drafts a day-by-day itinerary in seconds — with maps, photos, transit tips, and a magazine guide to every city. 300 credits free on signup, no card."
    />
    <link rel="canonical" href="https://tripjam.vercel.app/" />

    <!-- Open Graph / Facebook / iMessage / WhatsApp / Slack -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TripJam" />
    <meta property="og:url" content="https://tripjam.vercel.app/" />
    <meta
      property="og:title"
      content="TripJam — AI travel planning that feels personal"
    />
    <meta
      property="og:description"
      content="Day-by-day itineraries with maps, photos, transit tips, and a magazine guide. 300 credits free on signup."
    />
    <!-- TODO: design a dedicated 1200x630 og-image.png. Using mascot as fallback for now. -->
    <meta property="og:image" content="https://tripjam.vercel.app/mascot.png" />
    <meta property="og:image:width" content="1536" />
    <meta property="og:image:height" content="1024" />
    <meta
      property="og:image:alt"
      content="TripJam mascot — AI travel planning that feels personal"
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="TripJam — AI travel planning that feels personal"
    />
    <meta
      name="twitter:description"
      content="Day-by-day itineraries with maps, photos, transit tips, and a magazine guide. 300 credits free on signup."
    />
    <meta
      name="twitter:image"
      content="https://tripjam.vercel.app/mascot.png"
    />

    <style>
      /* Keyboard focus + motion preferences — applies to every page,
         including Home/Auth/Landing which have no own style block */
      :focus-visible {
        outline: 2px solid #2563a8;
        outline-offset: 2px;
        border-radius: 4px;
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>

    <!-- Travelpayouts Drive — site verification + auto-tags outbound clicks to
         supported merchants (Booking etc.) with our partner marker. Pairs with
         the plain Booking deep links in src/booking.js (keep
         VITE_HOTEL_LINK_PREFIX unset while this runs, to avoid double-tagging). -->
    <script
      nowprocket
      data-noptimize="1"
      data-cfasync="false"
      data-wpfc-render="false"
      seraph-accel-crit="1"
      data-no-defer="1"
      data-cmp-ab="2"
    >
      (function () {
        var script = document.createElement("script");
        script.async = 1;
        script.setAttribute("data-cmp-ab", "2");
        script.src = "https://emrldtp.cc/NTU5Mjk2.js?t=559296";
        document.head.appendChild(script);
      })();
    </script>
  </head>
  <body
    style="
      height: 100%;
      overflow: hidden;
      margin: 0;
      padding: 0;
      position: fixed;
      width: 100%;
    "
  >
    <div id="root" style="height: 100%"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
